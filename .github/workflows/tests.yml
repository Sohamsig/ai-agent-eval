name: Run Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run each task independently
        shell: bash
        run: |
          set -e

          for task_dir in tasks/task_*; do
            if [ -d "$task_dir" ]; then
              echo "Running tests in $task_dir"
              (
                cd "$task_dir"
                python -m pytest -q
              )
            fi
          done